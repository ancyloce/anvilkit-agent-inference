apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "anvilkit-agent-inference.fullname" . }}
  labels:
    {{- include "anvilkit-agent-inference.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "anvilkit-agent-inference.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "anvilkit-agent-inference.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ printf "%s|%s|%v" (toYaml .Values.config) .Values.tls.mode .Values.development.enabled | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "anvilkit-agent-inference.serviceAccountName" . }}
      automountServiceAccountToken: false
      # No injected service-link variables: the configuration loader rejects
      # any ANVILKIT_INFERENCE_* variable outside its allowlist.
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: inference
          image: {{ include "anvilkit-agent-inference.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: ANVILKIT_INFERENCE_CONFIG
              value: /etc/anvilkit/anvilkit-agent-inference/config.yaml
            - name: ANVILKIT_INFERENCE_LISTEN
              value: {{ printf "%s:%d" .Values.listen.address (int .Values.listen.port) | quote }}
            {{- if eq .Values.tls.mode "tls" }}
            - name: ANVILKIT_INFERENCE_TLS_CERT_FILE
              value: /etc/anvilkit/tls/tls.crt
            - name: ANVILKIT_INFERENCE_TLS_KEY_FILE
              value: /etc/anvilkit/tls/tls.key
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.listen.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: http
              scheme: {{ include "anvilkit-agent-inference.probeScheme" . }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              scheme: {{ include "anvilkit-agent-inference.probeScheme" . }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: {{ include "anvilkit-agent-inference.probeScheme" . }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/anvilkit/anvilkit-agent-inference
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if eq .Values.tls.mode "tls" }}
            - name: tls
              mountPath: /etc/anvilkit/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "anvilkit-agent-inference.fullname" . }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- if eq .Values.tls.mode "tls" }}
        - name: tls
          secret:
            secretName: {{ include "anvilkit-agent-inference.tlsSecret" . }}
            defaultMode: 0440
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
