{{- include "anvilkit-agent-inference.require" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "anvilkit-agent-inference.fullname" . }}
  labels:
    {{- include "anvilkit-agent-inference.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- $tls := dict "mode" .Values.tls.mode }}
    {{- if eq .Values.tls.mode "mtls" }}{{- $_ := set $tls "allowed_peers" .Values.tls.allowedPeers }}{{- end }}
    {{- toYaml (merge (dict "tls" $tls "development" (dict "enabled" .Values.development.enabled)) (deepCopy .Values.config)) | nindent 4 }}
