# Independent verification of anvilkit-agent-inference from this repository
# alone: the image (the generated pydantic models of openapi/inference.yaml
# from a checkout of the contracts repository at the commit the parent pins:
# 1c3ef95, tag go/v0.1.10; the hash-locked dependencies and the weights of
# models.lock fetched and verified at build), the tests inside that image with
# no network (the compute contract on fake models and, with the image's
# locked weights, the real BGE-M3 and reranker computations), and the chart.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ancyloce/anvilkit-agent-contracts
          ref: e62323270cfd31055d40ed38d96044f68883c3c4
          path: contracts
      - run: docker build --build-context contracts=contracts -t anvilkit-agent-inference:ci .
      - run: docker run --rm --network none --entrypoint /opt/venv/bin/python anvilkit-agent-inference:ci -m unittest discover -s tests
  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: "v3.19.0"
      - run: helm lint deploy/chart --set tls.certificate.issuerRef.name=ci-issuer
      - run: helm template anvilkit-agent-inference deploy/chart --set image.tag=ci --set tls.certificate.issuerRef.name=ci-issuer > /dev/null
